spring:
  datasource:
    url: jdbc:h2:mem:campus_task_platform;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false

credit:
  events:
    # 测试由用例显式控制消费时机，避免后台任务干扰断言。
    auto-process: false
    retry-enabled: false
